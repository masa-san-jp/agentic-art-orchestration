name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 tools/validate.py --check
      - run: python3 tools/project_status.py --check-readme
      - name: Materialize deterministic offline inputs
        run: |
          python3 tools/workspace.py init --offline-fixture
          python3 tools/workspace.py snapshot
          python3 tools/status.py --offline-fixture
          python3 tools/audit.py --offline-fixture
          python3 tools/startup.py --offline-fixture
          python3 tools/startup.py --offline-fixture --check
          python3 tools/retrieval.py
          python3 tools/issue_router.py
          python3 tools/github_issue_adapter.py --fixture
          python3 tools/github_issue_adapter.py --fixture --check
          python3 tools/drive_live_check.py --plan
          python3 tools/drive_live_check.py --plan --check
          python3 tools/improvement_loop.py
          python3 tools/async_auditor.py --state tests/fixtures/async-audit/state.yaml
          python3 tools/interaction_e2e.py
          python3 tools/security.py --offline-fixture
      - run: python3 -m unittest discover -s tests -v

  real-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify read-only private child repository credential
        env:
          AAP_CHILD_REPOS_TOKEN: ${{ secrets.AAP_CHILD_REPOS_TOKEN }}
        run: |
          if [ -z "$AAP_CHILD_REPOS_TOKEN" ]; then
            echo "::error::MISSING_EXTERNAL_SECRET: AAP_CHILD_REPOS_TOKEN is required to read the private child repositories; configure it as an Actions secret without committing the credential."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/checkout@v4
        with:
          repository: masa-san-jp/self-model-notes
          ref: main
          path: repos/self-model-notes
          fetch-depth: 0
          token: ${{ secrets.AAP_CHILD_REPOS_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: masa-san-jp/art-history-notes
          ref: main
          path: repos/art-history-notes
          fetch-depth: 0
          token: ${{ secrets.AAP_CHILD_REPOS_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: masa-san-jp/marketing-trends-notes
          ref: main
          path: repos/marketing-trends-notes
          fetch-depth: 0
          token: ${{ secrets.AAP_CHILD_REPOS_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: masa-san-jp/agentic-art-research
          ref: main
          path: repos/agentic-art-research
          fetch-depth: 0
          token: ${{ secrets.AAP_CHILD_REPOS_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: masa-san-jp/agentic-art-production
          ref: main
          path: repos/agentic-art-production
          fetch-depth: 0
          token: ${{ secrets.AAP_CHILD_REPOS_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: masa-san-jp/viewer-response-notes
          ref: feat/viewer-response-contracts
          path: repos/viewer-response-notes
          fetch-depth: 0
          token: ${{ secrets.AAP_CHILD_REPOS_TOKEN }}
          persist-credentials: false
      - name: Provision parent and per-child dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt
          child_python_root="$RUNNER_TEMP/child-python"
          child_requirements_root="$RUNNER_TEMP/child-requirements"
          mkdir -p "$child_python_root"
          mkdir -p "$child_requirements_root"
          while IFS='|' read -r repository_id child; do
            python3 -m venv "$child_python_root/$repository_id"
            child_python="$child_python_root/$repository_id/bin/python"
            if [ -f "$child/requirements-dev.txt" ]; then "$child_python" -m pip install -r "$child/requirements-dev.txt"; fi
            if [ -f "$child/requirements.txt" ]; then "$child_python" -m pip install -r "$child/requirements.txt"; fi
            if [ -f "$child/pyproject.toml" ]; then
              dependency_file="$child_requirements_root/$repository_id.txt"
              "$child_python" -c 'import pathlib, sys, tomllib; source = tomllib.loads(pathlib.Path(sys.argv[1]).read_text()); dependencies = source.get("project", {}).get("dependencies", []); pathlib.Path(sys.argv[2]).write_text("\n".join(dependencies) + ("\n" if dependencies else ""))' "$child/pyproject.toml" "$dependency_file"
              if [ -s "$dependency_file" ]; then "$child_python" -m pip install -r "$dependency_file"; fi
            fi
          done <<'EOF'
          self-model|repos/self-model-notes
          art-history|repos/art-history-notes
          marketing-trends|repos/marketing-trends-notes
          agentic-art-research|repos/agentic-art-research
          agentic-art-production|repos/agentic-art-production
          viewer-response-notes|repos/viewer-response-notes
          EOF
      - name: Qualify the real immutable exchange chain
        run: |
          python3 tools/qualify_pin_update.py \
            --workspace-root repos \
            --output /tmp/pin-update-qualification.json \
            --run-id ci-real-chain \
            --timeout 900 \
            --python-root "$RUNNER_TEMP/child-python"

  # The bootstrap job validates against the offline fixture mirror. This job also
  # exercises the Research/Production/Viewer exchange against the exact manifest pins.
  production-exchange:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Materialize the manifest-pinned children
        env:
          CHILD_REPOS_TOKEN: ${{ secrets.CHILD_REPOS_TOKEN }}
        run: >-
          python3 tools/pinned_workspace.py --output "$RUNNER_TEMP/pinned"
          --repository agentic-art-research
          --repository agentic-art-production
          --repository viewer-response-notes
      - name: Run the Research/Production/Viewer exchange against the real children
        run: |
          python3 tools/production_exchange.py \
            --workspace-root "$RUNNER_TEMP/pinned" \
            --output-root "$RUNNER_TEMP/exchange" \
            --evidence "$RUNNER_TEMP/exchange-evidence.json"
