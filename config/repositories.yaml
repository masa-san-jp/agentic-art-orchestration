version: 1
workspace_root: repos
repositories:
  - id: self-model
    full_name: masa-san-jp/self-model-notes
    url: https://github.com/masa-san-jp/self-model-notes.git
    path: self-model-notes
    role: input-kb
    authority: self-model entities, evidence, claims, patterns, and export policy
    default_branch: main
    observed_commit: 2bb28dc23f45e497e0b36925b314d77e21558dbf
    instructions: AGENTS.md
    requirement_ssot: https://github.com/masa-san-jp/self-model-notes/issues/1
    quality_gates:
      - python3 tools/build_graph.py --check
      - python3 -m unittest discover -s tests -p "test_*.py"
    knowledge_profile:
      answerable_questions:
        - "What self-model claims, patterns, tensions, or states are explicitly supported?"
        - "What consent scope and unknowns constrain use of this self-model knowledge?"
      canonical_entities: [entity, claim, pattern, tension, state, evidence]
      retrieval_entry_points:
        - {kind: file, locator: README.md, purpose: repository scope and export boundary}
        - {kind: directory, locator: entities, purpose: canonical self-model entities}
        - {kind: signal, locator: normalized-research-signal/v1, purpose: approved derived export}
      evidence_rules:
        allowed_kinds: [observed, inferred, derived]
        requires_locator: true
        minimum_quality: observed
      freshness_rules:
        policy: explicit
        allowed_statuses: [current, stale, unknown]
        revalidation_required: true
      feedback_owner: self-model
      write_scope:
        mode: issue-or-draft-pr
        allowed_paths: [entities, evidence, README.md, AGENTS.md]
      forbidden_data: [PRIVATE_RAW, RESTRICTED, credential, direct_identifier, raw_voice_body]
    export_contract: normalized-research-signal/v1

  - id: art-history
    full_name: masa-san-jp/art-history-notes
    url: https://github.com/masa-san-jp/art-history-notes.git
    path: art-history-notes
    role: input-kb
    authority: art-history entities, relations, evidence, and graph
    default_branch: main
    observed_commit: 1c0c1734e97f3c56c58a90ba93bc02638a62b947
    instructions: README.md
    requirement_ssot: https://github.com/masa-san-jp/art-history-notes/issues/1
    quality_gates:
      - python3 tools/build_graph.py --check
      - python3 tools/build_context_vectors.py --check
      - python3 -m unittest discover -s tests -p "test*.py"
    knowledge_profile:
      answerable_questions:
        - "What entities, relations, periods, regions, and evidence are recorded?"
        - "What is the strength and limitation of an art-history relation?"
      canonical_entities: [entity, movement, person, relation, source, evidence]
      retrieval_entry_points:
        - {kind: file, locator: README.md, purpose: repository scope and evidence rules}
        - {kind: directory, locator: entities, purpose: canonical art-history entities}
        - {kind: signal, locator: normalized-research-signal/v1, purpose: stable entity and relation export}
      evidence_rules:
        allowed_kinds: [primary, secondary, scholarly, derived]
        requires_locator: true
        minimum_quality: scholarly
      freshness_rules:
        policy: explicit
        allowed_statuses: [current, stale, unknown]
        revalidation_required: true
      feedback_owner: art-history
      write_scope:
        mode: issue-or-draft-pr
        allowed_paths: [entities, sources, overviews, README.md]
      forbidden_data: [PRIVATE_RAW, RESTRICTED, credential, direct_identifier]
    export_contract: normalized-research-signal/v1

  - id: marketing-trends
    full_name: masa-san-jp/marketing-trends-notes
    url: https://github.com/masa-san-jp/marketing-trends-notes.git
    path: marketing-trends-notes
    role: input-kb
    authority: marketing trends, practices, freshness, evidence, and graph
    default_branch: main
    observed_commit: d776a2fd1212c6a6c7b99f2fa72dd3b670b89533
    instructions: README.md
    requirement_ssot: https://github.com/masa-san-jp/marketing-trends-notes/issues/1
    quality_gates:
      - python3 tools/build_graph.py --check
      - python3 tools/audit.py --dry-run
    knowledge_profile:
      answerable_questions:
        - "What external trends, practices, and evidence are currently recorded?"
        - "What freshness, retrieval, vendor-interest, and counterevidence constraints apply?"
      canonical_entities: [trend, practice, evidence, source, counterevidence, prediction]
      retrieval_entry_points:
        - {kind: file, locator: README.md, purpose: collection scope and freshness boundary}
        - {kind: directory, locator: trends, purpose: canonical external trends}
        - {kind: signal, locator: normalized-research-signal/v1, purpose: freshness-aware trend export}
      evidence_rules:
        allowed_kinds: [primary, secondary, summary, anecdotal, derived]
        requires_locator: true
        minimum_quality: independent
      freshness_rules:
        policy: domain-defined
        allowed_statuses: [current, stale, unknown]
        revalidation_required: true
      feedback_owner: marketing-trends
      write_scope:
        mode: issue-or-draft-pr
        allowed_paths: [trends, sources, overviews, README.md]
      forbidden_data: [PRIVATE_RAW, RESTRICTED, credential, direct_identifier]
    export_contract: normalized-research-signal/v1

  - id: agentic-art-research
    full_name: masa-san-jp/agentic-art-research
    url: https://github.com/masa-san-jp/agentic-art-research.git
    path: agentic-art-research
    role: consumer-runtime
    authority: research projects, execution state, decisions, requirements, and outputs
    default_branch: main
    observed_commit: 87e5053615c46833e1a675e22f0d0c4c37889cdd
    instructions: AGENTS.md
    requirement_ssot: https://github.com/masa-san-jp/agentic-art-research/issues/2
    quality_gates:
      - python3 -m compileall -q tools tests
      - python3 tools/validate.py --check
      - python3 -m unittest discover -s tests -v
      - python3 tools/build_graph.py --check
    knowledge_profile:
      answerable_questions:
        - "What research requirements, decisions, and normalized signals are available?"
        - "What outputs can be produced with complete source provenance and known gaps?"
      canonical_entities: [requirement, signal, decision, research-run, output, evidence]
      retrieval_entry_points:
        - {kind: file, locator: README.md, purpose: consumer runtime scope}
        - {kind: directory, locator: requirements, purpose: research requirements and acceptance}
        - {kind: signal, locator: normalized-research-signal/v1, purpose: compatible cross-repository inputs}
      evidence_rules:
        allowed_kinds: [primary, secondary, scholarly, independent, derived]
        requires_locator: true
        minimum_quality: derived
      freshness_rules:
        policy: domain-defined
        allowed_statuses: [current, stale, unknown, not-applicable]
        revalidation_required: true
      feedback_owner: agentic-art-research
      write_scope:
        mode: issue-or-draft-pr
        allowed_paths: [requirements, decisions, projects, outputs, README.md]
      forbidden_data: [PRIVATE_RAW, RESTRICTED, credential, direct_identifier, unapproved_export]
    import_contract: normalized-research-signal/v1

  - id: agentic-art-production
    full_name: masa-san-jp/agentic-art-production
    url: https://github.com/masa-san-jp/agentic-art-production.git
    path: agentic-art-production
    role: control-plane-extension
    authority: production handoff acceptance, planning, prototype, execution, installation, acceptance, and production result feedback
    default_branch: main
    observed_commit: ad4ea48e8e2455c44d36c1fe523b2f7816214ce5
    instructions: AGENTS.md
    requirement_ssot: https://github.com/masa-san-jp/agentic-art-production/issues/10
    quality_gates:
      - python3 tools/validate.py --check
      - python3 -m unittest discover -s tests -v
      - python3 tools/run_evaluation.py --format json
    knowledge_profile:
      answerable_questions:
        - "What production scope, plans, prototypes, runtime state, outputs, quality results, and gaps are recorded?"
        - "What production result can be returned to research with complete provenance and explicit external-validation status?"
      canonical_entities: [production-project, handoff-receipt, plan, prototype, task, output, quality-result, installation, production-result]
      retrieval_entry_points:
        - {kind: file, locator: README.md, purpose: production runtime scope and repository boundary}
        - {kind: directory, locator: schemas, purpose: production-owned contracts and external snapshots}
        - {kind: issue, locator: https://github.com/masa-san-jp/agentic-art-production/issues/10, purpose: production requirement SSOT}
      evidence_rules:
        allowed_kinds: [handoff, plan, test, observation, external-validation, derived]
        requires_locator: true
        minimum_quality: explicit
      freshness_rules:
        policy: explicit
        allowed_statuses: [current, stale, unknown, not-applicable]
        revalidation_required: true
      feedback_owner: agentic-art-production
      write_scope:
        mode: issue-or-draft-pr
        allowed_paths: [config, schemas, docs, tools, tests, execution, README.md, AGENTS.md]
      forbidden_data: [PRIVATE_RAW, RESTRICTED, credential, direct_identifier, signed_url, asset_body, contract_original]
    exchange_contracts:
      imports: [production-handoff/v1]
      exports: [production-result/v1]
