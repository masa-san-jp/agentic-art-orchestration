contract_version: element-sequence/v1
max_attempts: 5
driver: phase-a
# Templates of Phase A v2 (docs/20261010-phase-a-v2-design.md, chapter 5). The driver copies one
# per request, fills inputs with literals and substitutes {link_type}; the program owns every ID.
elements:
  - kind: element
    element_id: A4.screen
    instruction: 本人の素材と、はっきりした関係（同じ・逆・答え・背景のどれか）があるカードを1つだけ選び、番号を返してください。どれにもなければ 0 を返してください。
    inputs:
      material: {literal: ''}
      link_types: {literal: {}}
      cards: {literal: {}}
    answer_format: {type: choice, choices: ['0', '1']}
    checks: [non_empty]
  - kind: element
    element_id: A4.rank
    instruction: 次のカードはどれも、本人の素材と関係があるとして選ばれたものです。関係が最もはっきりしていて具体的なものを1つ選んでください。
    inputs:
      material: {literal: ''}
      link_types: {literal: {}}
      cards: {literal: {}}
    answer_format: {type: choice, choices: ['1', '2']}
    checks: [non_empty]
  - kind: element
    element_id: A5.type
    instruction: 本人の素材とこのカードの関係を、一覧から一つ選んでください。どれにも当たらなければ「なし」を返してください。
    inputs:
      material: {literal: ''}
      card: {literal: ''}
      link_types: {literal: {}}
    answer_format: {type: choice, choices: [同じ, 逆, 答え, 背景, なし]}
    checks: [non_empty]
  - kind: element
    element_id: A5.card-quote
    instruction: 本人の素材との『{link_type}』の関係の根拠になる部分を、次の抜き書きから一字も変えずに抜いてください。
    inputs:
      card_excerpts: {literal: ''}
      link_type: {literal: ''}
    hidden: {label: ''}
    answer_format: {type: text, min_chars: 6, max_chars: 80}
    checks: [non_empty, 'exact_input_excerpt:card_excerpts', 'not_label:label', no_reference_tokens]
  - kind: element
    element_id: A5.self-quote
    instruction: 参照カードとの『{link_type}』の関係の根拠になる部分を、本人の素材の文から一字も変えずに抜いてください。
    inputs:
      material_statement: {literal: ''}
      link_type: {literal: ''}
    answer_format: {type: text, min_chars: 4, max_chars: 60}
    checks: [non_empty, 'exact_input_excerpt:material_statement']
  - kind: element
    element_id: A5.sentence
    instruction: 本人の素材とカードの『{link_type}』の関係を、平叙文の一文で書いてください。2つの抜き書きの言葉を使ってください。
    inputs:
      self_quote: {literal: ''}
      card_quote: {literal: ''}
      card_label: {literal: ''}
      link_type: {literal: ''}
      link_type_description: {literal: ''}
    hidden: {specificity: {}}
    answer_format: {type: text, max_chars: 100}
    checks: [non_empty, one_sentence, not_question, 'contains_source_terms:self_quote,card_quote', 'forbidden:∩,無し,未記入', 'specific_to_window:specificity']
  - kind: element
    element_id: A5.sentence.probe
    instruction: 次の文は、どの関係を述べていますか。一つ選んでください。
    inputs:
      sentence_masked: {literal: ''}
      link_types: {literal: {}}
    hidden: {expected: ''}
    answer_context: fresh
    answer_format: {type: choice, choices: [同じ, 逆, 答え, 背景]}
    checks: [non_empty]
  - kind: element
    element_id: A7.overlap
    instruction: 次の3つが重なるところを、平叙文の一文で書いてください。芸術の側の名前（art_label）を文に含めてください。
    inputs:
      material_statement: {literal: ''}
      art_sentence: {literal: ''}
      market_sentence: {literal: ''}
      art_label: {literal: ''}
    hidden:
      self_quote: ''
      art_card_quote: ''
      market_card_quote: ''
    answer_format: {type: text, max_chars: 120}
    # The art side must stay named: a two-character shingle such as 対応 satisfied the term check,
    # and LeWitt's "perfunctory execution" was read as an office task downstream (#293).
    checks: [non_empty, one_sentence, not_question, 'contains_source_terms:self_quote,art_card_quote,market_card_quote', 'contains_terms:art_label', 'not_similar_to:art_sentence', 'not_similar_to:market_sentence', 'forbidden:∩,無し,未記入']
  - kind: element
    element_id: A7.question
    instruction: 重なりの文を、研究で確かめる問い一文にしてください。はい・いいえで答えられない開いた問いにしてください。芸術の側の名前（art_label）を問いに含めてください。
    inputs:
      overlap: {literal: ''}
      self_quote: {literal: ''}
      art_card_quote: {literal: ''}
      market_card_quote: {literal: ''}
      art_label: {literal: ''}
    answer_format: {type: text, max_chars: 140}
    checks: [non_empty, one_sentence, ends_with_question, open_question, 'contains_source_terms:self_quote,art_card_quote,market_card_quote', 'contains_terms:art_label', 'forbidden:∩,無し,未記入']
