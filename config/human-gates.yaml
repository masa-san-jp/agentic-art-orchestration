contract_version: human-gates/v1
human_operations:
  - merge
  - release
  - public_share
  - consent_expansion
  - destructive_git
  - external_cost_over_declared_budget
  - physical_action
default_status: BLOCKED_HUMAN
worker_may_request: true
execution_policy: never_execute_requested_human_operation
# public_share is the human boundary for request-backed local projection only.
# The canonical PLAN_READY/PASSED automatic plan lane is a closed producer
# exception: it may materialize plan records locally after mechanical checks,
# but it never creates approval or performs remote publication. The worker may
# validate and request public_share for work/manual requests. init-target
# --apply is layout-only local scaffolding and is outside this operation;
# target commit/push/merge, release, visibility changes, and actual public
# sharing remain separate gates.
operation_scopes:
  public_share:
    contract_version: public-projection-approval/v1
    required_status: APPROVED
    required_authority: HUMAN
    required_scope: local-public-project-projection
    applies_to:
      - tools/public_projection.py project --apply
    excludes:
      - tools/run.py PLAN_READY automatic plan projection
      - tools/batch_run.py PASSED automatic plan projection
      - tools/public_projection.py init-target --apply
      - target_git_commit_push_merge_release
      - repository_visibility_change
merge_classes:
  CLASS_RECORD:
    description: execution state, handoff, and task-queue records only
    path_prefixes: [execution/]
    auto_merge: false
    human_approval_required: true
  CLASS_DOCS:
    description: documentation and repository guidance only
    path_prefixes: [README.md, AGENTS.md, PLANS.md, docs/]
    auto_merge: false
    human_approval_required: true
  CLASS_CODE:
    description: tools and tests
    path_prefixes: [tools/, tests/]
    auto_merge: false
    human_approval_required: true
  CLASS_CONTRACT:
    description: schemas, manifest pins, configuration contracts, and CI workflows
    path_prefixes: [schemas/, config/, .github/workflows/]
    auto_merge: false
    human_approval_required: true
